<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring · 状态总览</title>
<meta name="description" content="实时查看当前状态与历史状态记录（活动内容 / 起止时间 / 备注）。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='%230f6cbd'/></svg>">
<link rel="stylesheet" href="assets/tokens.min.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="app-header">
  <span class="app-header__brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
    </svg>
    <span>Monitoring</span>
  </span>
  <nav class="row" aria-label="主导航">
    <a class="nav-link" href="index.html" aria-current="page">总览</a>
    <a class="nav-link" href="edit.html">编辑状态</a>
  </nav>
  <span class="app-header__spacer"></span>
  <button class="btn btn--subtle btn--icon" type="button" data-theme-toggle aria-label="切换主题">☾</button>
</header>

<main class="shell">
  <div class="stack">
    <div class="banner" id="local-banner" hidden>
      <span>本机存在未发布的修改，当前显示的是本地版本。</span>
      <a href="edit.html">去发布</a>
    </div>

    <div class="row row--between">
      <div>
        <h1 class="title3" id="owner-name">Monitoring</h1>
        <p class="body1 muted" id="owner-bio"></p>
      </div>
      <p class="caption1" id="updated-at"></p>
    </div>

    <section class="card" data-hero aria-live="polite"></section>

    <section aria-label="统计">
      <div id="stats"></div>
    </section>

    <section class="card">
      <div class="row row--between">
        <h2 class="subtitle1">状态记录</h2>
        <span class="caption1" id="record-count"></span>
      </div>
      <div id="timeline" style="margin-top: var(--spacingVerticalL)"></div>
    </section>

    <p class="caption1" id="page-footer"></p>
  </div>
</main>

<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/view.js"></script>
</body>
</html>
